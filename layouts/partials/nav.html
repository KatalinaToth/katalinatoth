<nav class="site-nav" aria-label="Main navigation">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <ul class="nav-links">
      {{- range .Site.Menus.main }}
      {{- $u := .URL }}
      {{- if not (strings.HasPrefix $u "#") }}{{ $u = $u | relURL }}{{ end }}
      <li><a href="{{ $u }}"{{ if strings.HasSuffix .URL ".pdf" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </div>
</nav>
